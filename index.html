<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Kalkulator HPP sederhana untuk UMKM Indonesia."
    >

    <title>HPP Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>HPP Calculator</h1>
            <p>
                Hitung modal produk, harga jual, dan batas diskon.
            </p>
        </div>
    </header>


    <main class="container">

        <section class="card">

            <h2>Produk</h2>

            <div class="form-group">
                <label for="productName">
                    Nama produk
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Contoh: Brownies Coklat"
                >
            </div>

        </section>


        <section class="card">

            <h2>Bahan</h2>

            <p class="helper-text">
                Tambahkan bahan yang digunakan untuk membuat produk.
            </p>

            <div id="ingredients">

                <div class="ingredient-row">

                    <input
                        type="text"
                        placeholder="Nama bahan"
                        class="ingredient-name"
                    >

                    <input
                        type="number"
                        placeholder="Harga beli"
                        class="ingredient-price"
                        min="0"
                    >

                    <input
                        type="number"
                        placeholder="Jumlah dipakai"
                        class="ingredient-quantity"
                        min="0"
                    >

                </div>

            </div>

            <button
                type="button"
                id="addIngredient"
                class="button secondary"
            >
                + Tambah Bahan
            </button>

        </section>


        <section class="card">

            <h2>Hasil</h2>

            <div class="result-box">

                <div class="result-item">
                    <span>Total Biaya Bahan</span>
                    <strong id="totalIngredientCost">
                        Rp0
                    </strong>
                </div>

                <div class="result-item">
                    <span>HPP per Unit</span>
                    <strong id="hppPerUnit">
                        Rp0
                    </strong>
                </div>

            </div>

        </section>


    </main>


    <footer class="footer">

        <div class="container">

            <p>
                HPP Calculator — Free Tool untuk UMKM
            </p>

        </div>

    </footer>


    <script src="app.js"></script>

</body>
</html>
